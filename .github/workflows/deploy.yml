name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Insert the contact form key
        env:
          JAO_CONTACT_KEY: ${{ secrets.JAO_CONTACT_KEY }}
        run: |
          if [ -z "$JAO_CONTACT_KEY" ]; then
            echo "::warning::JAO_CONTACT_KEY secret is not set; the contact form will be refused by the API"
          elif ! printf '%s' "$JAO_CONTACT_KEY" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "::error::JAO_CONTACT_KEY may only use letters, digits, - and _ (openssl rand -hex 32)"; exit 1
          else
            sed -i "s/__JAO_CONTACT_KEY__/${JAO_CONTACT_KEY}/g" index.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
