name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          # the contact form's shared key (X-Jao-Key), a repository variable: it ends up in the public page anyway.
          # The API refuses the form without it.
          VITE_JAO_CONTACT_KEY: ${{ vars.JAO_CONTACT_KEY }}
        run: |
          if [ -z "$VITE_JAO_CONTACT_KEY" ]; then
            echo "::warning::JAO_CONTACT_KEY repository variable is not set; the contact form will be refused by the API"
          fi
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
