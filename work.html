<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work · Rajhi John Tabora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500;62..125,800;62..125,900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
<link rel="stylesheet" href="assets/sliders.css">
<style>
  /* Project detail slider — structure lives in assets/sliders.css, this is the skin */
[data-theme=rjt]{color-scheme:light;--color-base-content:#111;--color-primary:#a3ff7a;--color-primary-content:#111;--color-neutral:#111;--color-neutral-content:#f1eefb;--radius-box:.5rem;--radius-field:.4rem;--border:3px;--depth:0;--noise:0;
 --fx-c1:#a3ff7a;--fx-c2:#ff8a3d;--fx-c3:#b69cff;--fx-c4:#ffe066;--fx-c5:#5cc8ff;--fx-a1:#111;--fx-a2:#111;--fx-a3:#111;--fx-a4:#111;--fx-a5:#111;
 --art-bg:#f1eefb;--art-0:#fff;--art-1:#a3ff7a;--art-2:#ff8a3d;--art-3:#b69cff;--art-stroke:#111;--art-sw:3;--art-r:3px;--art-filter:drop-shadow(4px 4px 0 #111)}
body{background:#f1eefb}.fx{font-family:Archivo,sans-serif;color:#111;background-image:linear-gradient(#1111111a 1px,transparent 1px),linear-gradient(90deg,#1111111a 1px,transparent 1px);background-size:28px 28px}
.bx{border:3px solid #111;box-shadow:8px 8px 0 #111}.bx-sm{border:3px solid #111;box-shadow:3px 3px 0 #111}
.btn-b{border:3px solid #111!important;box-shadow:4px 4px 0 #111;font-weight:800;transition:transform .08s,box-shadow .08s}.btn-b:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #111}.btn-b:active{transform:translate(4px,4px);box-shadow:0 0 0 #111}
.fx-title{font-stretch:125%;font-weight:900;text-transform:uppercase;color:#fff;-webkit-text-stroke:3px #111;paint-order:stroke fill;text-shadow:7px 7px 0 #111}
.fx-frame{rotate:-2deg}.fx-kicker{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.8rem;background:#111;color:#fff;width:fit-content;padding:0 .4rem}.fx-type{font-family:"IBM Plex Mono",monospace;font-size:.8rem}.fx-desc{font-weight:500}
/* screenshot slides: scrapbook collage of prints (see script below) */
.fx-slide.has-shots .fx-frame{border:0;box-shadow:none;background:transparent;padding:0;overflow:visible;rotate:0deg}
/* fluid scale like the home page; --gut is the side gutter, growing on wide screens so the slide stays a centred column */
html{font-size:clamp(16px,min(calc(10px + .42vw),1.75vh),21px)}
.fx{--gut:max(4vw,calc((100vw - 110rem) / 2))}
@media (min-width:768px){
 .fx-slide.has-shots{padding-left:var(--gut)}
 .fx-slide.has-shots .fx-title{left:var(--gut)}
 .fx-slide.has-shots .fx-frame{aspect-ratio:16/9;width:min(82rem,calc(100vw - 2 * var(--gut) - 25rem),calc((100svh - 19rem) * 1.78))}
 .fx-slide.has-shots .fx-details{width:22rem}
 .fx .fx-details{right:max(1.5rem,var(--gut));max-height:calc(100svh - 6.5rem);overflow-y:auto}
 .fx-top{padding-inline:max(1.25rem,var(--gut))}
 .fx-nav{left:max(1.5rem,var(--gut))}
}
/* short landscape screens: compact details card */
@media (min-width:768px) and (max-height:820px){.fx .fx-details{font-size:.875rem;gap:.45rem;padding:1rem}.fx-points{gap:.15rem}}
.shots-stack{overflow:visible;background:none;border:0;border-radius:0}
.print{position:absolute;margin:0;padding:8px 8px 0;background:#fff;border:3px solid #111;box-shadow:5px 5px 0 #111;cursor:zoom-in;transform:rotate(var(--r));transition:left .6s cubic-bezier(.2,.8,.2,1),top .6s cubic-bezier(.2,.8,.2,1),width .6s cubic-bezier(.2,.8,.2,1),transform .5s cubic-bezier(.2,.8,.2,1),opacity .35s,box-shadow .2s}
.print img{position:static;inset:auto;display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:left top;opacity:1;border:2px solid #111}
.print figcaption{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.7rem;text-transform:uppercase;padding:.35rem .1rem .45rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.print:hover{z-index:40!important;transform:rotate(var(--r)) scale(1.04)}
.print:focus-visible{outline-offset:4px}
.print.lead{cursor:default;box-shadow:10px 10px 0 #111}
.print.lead:hover{transform:rotate(var(--r))}
.print.lead figcaption{font-size:.8rem}
.print.off{opacity:0;pointer-events:none;transform:rotate(var(--r)) scale(.5)}
.print.tape::before{content:"";position:absolute;top:-13px;left:50%;width:68px;height:22px;background:#ffe066d9;border:2px solid #111;transform:translateX(-50%) rotate(-5deg);z-index:1}
.shot-note{position:absolute;left:0;bottom:0;width:clamp(9.5rem,21%,14rem);z-index:35;margin:0;padding:.75rem .85rem;background:#fff;border:3px solid #111;box-shadow:5px 5px 0 #111;transform:rotate(-3deg);display:flex;flex-direction:column;gap:.35rem}
.shot-note.at-right{left:auto;right:0}
.fx-slide.is-nda .fx-frame{border:3px solid #111;box-shadow:8px 8px 0 #111;background:#fff;padding:.6rem;overflow:hidden;rotate:-1deg}
.fx-slide.has-shots .fx-title{font-size:clamp(1.8rem,3.8vw,3.75rem)}
.shot-note h3{margin:0;font-stretch:125%;font-weight:900;text-transform:uppercase;font-size:1.05rem;line-height:1}
.shot-note p{margin:0;font-size:.8rem;font-weight:500;line-height:1.3}
.shot-note small{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.65rem}
.fx-links{display:flex;flex-wrap:wrap;gap:.5rem}.fx-links:empty{display:none}
.shot-tabs{position:absolute;left:0;top:-3.4rem;z-index:60;display:flex;flex-wrap:wrap;gap:.5rem}
.shot-tabs .btn[aria-pressed=true]{background:#111;color:#fff}
.shot-tabs .n{font-family:"IBM Plex Mono",monospace;font-weight:600;opacity:.7}
@media (max-width:767px){.shot-note{display:none}.shot-tabs{position:relative;top:auto;margin-bottom:.75rem}}
@media (prefers-reduced-motion:reduce){.print{transition:none}}
.fx-index-title{font-stretch:125%;font-weight:900;text-transform:uppercase}.fx-index::backdrop{background:rgba(17,17,17,.6);backdrop-filter:none}:focus-visible{outline:3px dashed #111;outline-offset:3px}
</style>
</head>
<body>
<div data-theme="rjt" class="fx" data-fashion="rjt" data-name="Rajhi John Tabora" data-chip="badge border-2 border-black font-bold bg-white">
  <div class="fx-decor" aria-hidden="true"></div>
  <header class="fx-top">
    <a href="index.html#work" class="btn btn-sm btn-b bg-white">← Portfolio</a>
    <h1 class="sr-only">Rajhi John Tabora · project details</h1>
    <button type="button" class="btn btn-sm btn-b bg-white" data-index-open aria-haspopup="dialog">All projects ▦</button>
  </header>
  <div class="fx-track"></div>
  <nav class="fx-nav" aria-label="Project navigation">
    <button type="button" class="btn btn-b bg-white btn-square btn-lg text-2xl" data-prev aria-label="Previous project">←</button>
    <span class="bx-sm bg-white px-2 font-black" data-count aria-live="polite"></span>
    <button type="button" class="btn btn-b bg-white btn-square btn-lg text-2xl" data-next aria-label="Next project">→</button>
  </nav>
  <dialog class="fx-index bx bg-[#f1eefb] rounded-box" data-index aria-label="All projects">
    <div class="fx-index-head"><p class="font-black text-3xl uppercase">All projects</p><button type="button" class="btn btn-sm btn-b bg-white" data-index-close>Close ✕</button></div>
    <div class="fx-index-grid" data-index-grid></div>
  </dialog>
</div>

<template data-slide>
  <div class="fx-frame bx bg-white p-3">{{art}}</div>
  <h2 class="fx-title " data-text="{{title}}">{{title}}</h2>
  <div class="fx-details bx bg-white rounded-box p-5">
    <p class="fx-kicker">{{n}} / {{total}} · {{cat}}</p>
    <p class="fx-desc">{{desc}}</p>
    <ul class="fx-points">{{points}}</ul>
    <div class="fx-chips">{{chips}}</div>
    <div class="fx-links">{{links}}</div>
    <p class="fx-type">{{type}}</p>
  </div>
</template>
<template data-index-item>
  <a href="#{{id}}" class="fx-index-item bx-sm bg-white" data-go="{{i}}">
    <div class="fx-index-art border-b-3 border-black">{{art}}</div>
    <p class="fx-kicker">{{n}} · {{cat}}</p>
    <p class="fx-index-title">{{title}}</p>
  </a>
</template>
<script src="assets/projects.js"></script>
<script src="assets/inventee.js"></script>
<script src="assets/side.js"></script>
<script src="assets/nda.js"></script>
<script src="assets/fashion.js"></script>
<script>
/* Screenshot slides: a scrapbook collage. The hero print sits in the middle, the rest pin around it.
   Click a print to make it the hero; tabs (from p.shotGroups) filter prints by group; the hero rotates on its own. */
(function () {
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Layouts return [left %, top %, width %, tilt deg] for print j of n (j = 0 is the lead).
  // The frame is 16:9 and prints 16:10, so a print's height % ≈ width % × 1.1.
  const TILT = [-6, 5, -3, 7, -5, 4, -7, 3, -4, 6, -2, 5];
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const LAYOUTS = {
    // lead in the middle, the rest in a ring around it
    desk(j, n) {
      if (j === 0) return n <= 3 ? [15, 2, 70, -2] : n <= 7 ? [22, 6, 58, -2] : [26, 16, 48, -1];
      const k = n - 1, i = j - 1, w = k <= 3 ? 30 : k <= 6 ? 27 : 21, a = -0.8 * Math.PI + i * 2 * Math.PI / k;
      return [clamp(50 + 44 * Math.cos(a) - w / 2, -2, 102 - w), clamp(48 + 42 * Math.sin(a) - w * 0.55, -6, 104 - w * 1.1), w, TILT[i % TILT.length]];
    },
    // lead on the right, the rest stacked down the left like index cards
    cascade(j, n) {
      if (j === 0) return n <= 3 ? [34, 2, 64, 2] : [40, 8, 58, 2];
      const k = n - 1, i = j - 1, w = k <= 3 ? 36 : 31, step = k > 1 ? (100 - w * 1.1) / (k - 1) : 0;
      return [i % 2 ? 7 : 0, k > 1 ? i * step : 20, w, i % 2 ? 3 : -3];
    },
    // lead low and centred, the rest fanned across the top
    fan(j, n) {
      if (j === 0) return n <= 3 ? [18, 22, 64, -1] : [22, 34, 56, -1];
      const k = n - 1, i = j - 1, w = k <= 3 ? 32 : 26, x = k > 1 ? i * (100 - w) / (k - 1) : 50 - w / 2, t = (x + w / 2 - 50) / 50;
      return [x, 2 + 12 * t * t, w, Math.round(12 * t)];
    },
    // lead centred over a pinboard grid of the rest
    wall(j, n) {
      if (j === 0) return n <= 4 ? [20, 14, 60, 1] : [25, 22, 50, 1];
      const k = n - 1, i = j - 1, cols = Math.max(2, Math.ceil(Math.sqrt(k * 1.8))), rows = Math.ceil(k / cols), w = Math.min(34, 104 / cols);
      const x = (i % cols) * (100 - w) / Math.max(1, cols - 1), y = rows > 1 ? Math.floor(i / cols) * (100 - w * 1.1) / (rows - 1) : 30;
      return [x, y, w, TILT[i % TILT.length] / 2];
    },
    // lead on the right, the rest dropped in a loose pile on the left
    pile(j, n) {
      if (j === 0) return [42, 4, 56, 3];
      const k = n - 1, i = j - 1, s = k > 1 ? i / (k - 1) : 0.5;
      return [1 + 10 * s, 8 + 46 * s, 38, Math.round(-9 + 14 * s)];
    },
  };
  const ORDER = ['desk', 'cascade', 'fan'];
  // NDA projects have no shots but use the same big-frame layout (their art is the redacted dossier from nda.js)
  document.querySelectorAll('.fx-slide').forEach(sl => { if (window.PROJECTS[+sl.dataset.i].nda) sl.classList.add('has-shots', 'is-nda'); });
  // long titles wrap to two lines: drop the frame (and any tabs) below whatever height the title takes
  document.querySelectorAll('.fx-slide.has-shots').forEach(sl => {
    const title = sl.querySelector('.fx-title'), frame = sl.querySelector('.fx-frame');
    const fit = () => { frame.style.marginTop = innerWidth >= 768 ? title.offsetHeight + 64 + 'px' : ''; };
    fit(); addEventListener('resize', fit);
  });
  document.querySelectorAll('.fx-slide.has-shots').forEach((slide, si) => {
    const p = window.PROJECTS[+slide.dataset.i], box = slide.querySelector('.art-shots'), groups = p.shotGroups;
    if (!box) return;
    const place = LAYOUTS[p.layout] || LAYOUTS[ORDER[si % ORDER.length]];
    box.classList.add('shots-stack');
    const prints = [...box.querySelectorAll('img')].map((im, k) => {
      const [, , g = '', label] = p.images[k];
      const fig = document.createElement('figure');
      fig.className = 'print' + (k % 3 === 1 ? ' tape' : ''); fig.dataset.g = g; fig.tabIndex = 0;
      im.removeAttribute('class'); im.removeAttribute('loading'); box.append(fig); fig.append(im);
      if (label) fig.insertAdjacentHTML('beforeend', `<figcaption>${window.escapeHTML(label)}</figcaption>`);
      fig.addEventListener('click', () => hero(fig));
      fig.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); hero(fig); } });
      return fig;
    });
    let shown = prints.slice(), base = shown.slice(), cur = 0, hover = false, note = null, tabs = [];
    // details card: a group's own desc / points / stack / links replace the project's while its tab is picked
    const det = slide.querySelector('.fx-details'), kicker = det.querySelector('.fx-kicker'), kick0 = kicker.textContent;
    const chipClass = document.querySelector('[data-fashion]').dataset.chip || '';
    function details(g) {
      const esc = window.escapeHTML, own = g && g.id !== 'all' ? g : {};
      kicker.textContent = kick0 + (own.label ? ' · ' + own.label : '');
      det.querySelector('.fx-desc').innerHTML = esc(own.desc || p.desc);
      det.querySelector('.fx-points').innerHTML = (own.points || p.points).map(s => `<li>${esc(s)}</li>`).join('');
      det.querySelector('.fx-chips').innerHTML = (own.stack || p.stack).map(s => `<span class="${chipClass}">${esc(s)}</span>`).join('');
      det.querySelector('.fx-links').innerHTML = window.projectLinks(own.links || p.links);
      if (!RM) det.animate([{ opacity: .35, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'ease-out' });
    }
    // move a print [x, y, w] (in % of the frame) out of the note card's box, or shrink it when there is no room
    function clearNote(pos) {
      if (!note || !note.offsetParent) return pos;
      const B = box.getBoundingClientRect(), R = note.getBoundingClientRect();
      if (!B.width) return pos;
      const gap = 18, W = B.width, H = B.height;
      const n = { l: R.left - B.left - gap, t: R.top - B.top - gap, r: R.right - B.left + gap, b: R.bottom - B.top + gap };
      let [x, y, w, r] = pos, px = x / 100 * W, py = y / 100 * H, pw = w / 100 * W;
      const ph = v => v * 0.625 + 46; // 16:10 shot + padding, caption and borders
      if (px >= n.r || px + pw <= n.l || py >= n.b || py + ph(pw) <= n.t) return pos;
      const minY = -0.06 * H, minX = -0.02 * W, maxX = W * 1.02, onLeft = n.l < W / 2;
      const moves = [];
      if (n.t - ph(pw) >= minY) moves.push([Math.abs(py - (n.t - ph(pw))), px, n.t - ph(pw), pw]);
      if (onLeft && n.r + pw <= maxX) moves.push([Math.abs(n.r - px), n.r, py, pw]);
      if (!onLeft && n.l - pw >= minX) moves.push([Math.abs(px - (n.l - pw)), n.l - pw, py, pw]);
      if (!moves.length) { // no room: shrink to whichever side leaves the bigger print
        const wUp = Math.max(0, (n.t - Math.max(py, minY) - 46) / 0.625), wSide = onLeft ? maxX - n.r : n.l - minX;
        moves.push(wUp >= wSide ? [0, px, n.t - ph(wUp), wUp] : [0, onLeft ? n.r : n.l - wSide, py, wSide]);
      }
      const [, nx, ny, nw] = moves.sort((a, b) => a[0] - b[0])[0];
      return [nx / W * 100, ny / H * 100, nw / W * 100, r];
    }
    function layout() {
      prints.forEach(f => f.classList.toggle('off', !shown.includes(f)));
      shown.forEach((f, j) => {
        const [x, y, w, r] = clearNote(shown.length === 1 ? [9, 2, 82, -1] : place(j, shown.length)); // a lone shot gets the whole frame
        Object.assign(f.style, { left: x + '%', top: y + '%', width: w + '%', zIndex: j === 0 ? 30 : 10 + j });
        f.style.setProperty('--r', r + 'deg');
        f.classList.toggle('lead', j === 0);
      });
    }
    function hero(fig) {
      const k = shown.indexOf(fig);
      if (k <= 0) return;
      [shown[0], shown[k]] = [shown[k], shown[0]];
      cur = base.indexOf(fig); layout();
    }
    function filter(id) {
      const g = groups.find(x => x.id === id);
      shown = prints.filter(f => id === 'all' || f.dataset.g === id); base = shown.slice(); cur = 0;
      tabs.forEach(t => t.setAttribute('aria-pressed', t.dataset.g === id));
      note.innerHTML = `<h3>${window.escapeHTML(g.label)}</h3><p>${window.escapeHTML(g.note)}</p><small>${String(shown.length).padStart(2, '0')} SHOTS · CLICK ONE ↗</small>`;
      if (det.dataset.g !== undefined || id !== 'all') details(g);
      det.dataset.g = id;
      layout();
    }
    if (groups) {
      const bar = document.createElement('div');
      bar.className = 'shot-tabs'; bar.setAttribute('role', 'group'); bar.setAttribute('aria-label', 'Filter screenshots');
      bar.innerHTML = groups.map(g => {
        const n = g.id === 'all' ? prints.length : prints.filter(f => f.dataset.g === g.id).length;
        return `<button type="button" class="btn btn-sm btn-b bg-white" data-g="${g.id}" aria-pressed="false">${window.escapeHTML(g.label)} <span class="n">${String(n).padStart(2, '0')}</span></button>`;
      }).join('');
      box.before(bar);
      tabs = [...bar.children];
      tabs.forEach(t => t.addEventListener('click', () => filter(t.dataset.g)));
      note = document.createElement('div'); note.className = 'shot-note' + (p.layout === 'cascade' ? ' at-right' : ''); box.append(note);
      filter('all');
    } else layout();
    addEventListener('resize', () => { clearTimeout(box._rz); box._rz = setTimeout(layout, 150); });
    new MutationObserver(() => slide.classList.contains('is-active') && requestAnimationFrame(layout)).observe(slide, { attributes: true, attributeFilter: ['class'] });
    box.addEventListener('pointerenter', () => hover = true);
    box.addEventListener('pointerleave', () => hover = false);
    if (!RM) setInterval(() => {
      if (hover || document.hidden || shown.length < 2 || !slide.classList.contains('is-active')) return;
      cur = (cur + 1) % base.length; hero(base[cur]);
    }, 4000);
  });
})();
</script>

</body>
</html>
